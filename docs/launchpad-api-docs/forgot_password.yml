info:
  name: Forgot Password
  type: http

http:
  method: POST
  url: http://localhost:8000/api/auth/password/forgot
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: form-urlencoded
    data:
      - name: email
        value: shadman@yopmail.com
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
