info:
  name: Change Password
  type: http

http:
  method: PUT
  url: http://localhost:8000/api/auth/password
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: form-urlencoded
    data:
      - name: current_password
        value: Admin@123
      - name: password
        value: Admin@456
      - name: password_confirmation
        value: Admin@456
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
