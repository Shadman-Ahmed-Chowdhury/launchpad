info:
  name: Reset Password
  type: http

http:
  method: POST
  url: http://localhost:8000/api/auth/password/reset
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: form-urlencoded
    data:
      - name: token
        value: "{{reset_token}}"
      - name: password
        value: Admin@456
      - name: password_confirmation
        value: Admin@456
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
