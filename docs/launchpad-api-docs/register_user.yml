info:
  name: Register User
  type: http

http:
  method: POST
  url: http://localhost:8000/api/auth/register
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: form-urlencoded
    data:
      - name: first_name
        value: Shadman
      - name: last_name
        value: Ahmed
      - name: email
        value: shadman@yopmail.com
      - name: password
        value: Admin@123
      - name: password_confirmation
        value: Admin@123
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
