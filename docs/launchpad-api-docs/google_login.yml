info:
  name: Google Login
  type: http

http:
  method: POST
  url: http://localhost:8000/api/auth/google
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: form-urlencoded
    data:
      - name: access_token
        value: ya29.a0AfH6SMC_google_oauth2_access_token
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
